name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Os runners do GitHub têm Docker, então os testes com Testcontainers (PostgreSQL) rodam de verdade.
      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore
