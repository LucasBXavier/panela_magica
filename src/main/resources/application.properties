spring.application.name=PanelaMagica

spring.config.import=optional:file:.env[.properties]


springdoc.api-docs.enabled=true
springdoc.api-docs.path=/panela-magica/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/panela-magica/swagger-ui.html


spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT (em produção defina a variável de ambiente JWT_SECRET com 32+ caracteres)
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60
jwt.issuer=panela-magica
jwt.refresh-expiration-days=7

# Limite de tentativas de login malsucedidas (janela fixa; contadores em memória)
auth.login.max-attempts=5
auth.login.max-attempts-per-ip=20
auth.login.window-minutes=15
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200

# application.properties
logging.level.root=INFO
logging.level.com.panelamagica=DEBUG
logging.level.org.springdoc=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

spring.jpa.open-in-view=false
