spring.application.name=PanelaMagica

spring.config.import=optional:file:.env[.properties]


springdoc.api-docs.enabled=true
springdoc.api-docs.path=/panela-magica/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/panela-magica/swagger-ui.html


spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# JWT (em produção defina a variável de ambiente JWT_SECRET com 32+ caracteres)
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200

# application.properties
logging.level.root=INFO
logging.level.com.todolist=DEBUG
logging.level.org.springdoc=WARN
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation=ERROR
