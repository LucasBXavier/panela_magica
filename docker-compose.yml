services:
  postgres:
    image: postgres:16-alpine
    container_name: panela-magica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: panela_magica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - panela-magica-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d panela_magica"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  panela-magica-data:
