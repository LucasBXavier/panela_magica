services:
  postgres:
    image: postgres:16-alpine
    container_name: panela-magica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panela_magica}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - panela-magica-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  panela-magica-data:
